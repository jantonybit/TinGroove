<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TinGroove — Jantonybit</title>
<style>
  :root { --bg:#12151c; --panel:#1b1f28; --line:#343a49; --gold:#d4af37;
          --text:#e8eaf0; --muted:#a8aebb; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:16px/1.7 "Segoe UI", Tahoma, sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:48px 22px; }
  header { border-bottom:2px solid var(--gold); padding-bottom:18px; margin-bottom:28px; }
  h1 { color:var(--gold); margin:0 0 4px; font-size:40px; }
  .sub { color:var(--muted); font-size:14px; letter-spacing:2px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:20px 24px; margin:14px 0; }
  .card h2 { color:var(--gold); margin:0 0 8px; font-size:20px; }
  .card p { margin:4px 0 12px; color:var(--muted); }
  a.btn { display:inline-block; background:#242a36; border:1px solid var(--line);
          color:var(--text); text-decoration:none; padding:9px 16px; border-radius:6px;
          margin-right:8px; }
  a.btn:hover { border-color:var(--gold); color:var(--gold); }
  footer { color:var(--muted); font-size:13px; margin-top:36px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>TinGroove</h1>
  <div class="sub">SOUND DESIGNER BY JANTONYBIT</div>
</header>

<div class="card">
  <h2>Privacy Policy / Política de Privacidade</h2>
  <p>Documento oficial para o listing da Microsoft Store.</p>
  <a class="btn" href="privacy-policy.html">Português (BR)</a>
  <a class="btn" href="privacy-policy.en.html">English</a>
</div>

<div class="card">
  <h2>Support / Suporte</h2>
  <p>Dúvidas, bugs e solicitações de privacidade:</p>
  <a class="btn" href="https://github.com/Jantonybit/TinGroove/issues">GitHub Issues</a>
</div>

<footer>TinGroove · Sound Designer by Jantonybit</footer>
</div>
</body>
</html>
